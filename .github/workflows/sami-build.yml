name: Build sami branch

on:
  push:
    branches:
      - sami
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      timestamp: ${{ steps.version.outputs.timestamp }}
    steps:
      - uses: actions/checkout@v4
      - uses: sjawhar/.github/.github/actions/sami-version@v1
        id: version
        with:
          source: cargo

  build:
    name: Build CLI
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libclang-dev cmake \
            libvulkan-dev vulkan-tools libshaderc-dev glslc

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release --features deepgram,gpu-vulkan

      - name: Package binary
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          mkdir -p dist
          cp target/release/voxtype dist/
          cd dist
          tar czf "voxtype-${TAG}-linux-x86_64.tar.gz" voxtype
          ls -la *.tar.gz

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: voxtype-linux-x86_64
          path: dist/*.tar.gz

  release:
    name: Create release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: voxtype-linux-x86_64
          path: artifacts

      - uses: sjawhar/.github/.github/actions/sami-release@v1
        with:
          tag: ${{ needs.version.outputs.tag }}
          files: artifacts/*
